/* absolute font paths: GitHub Pages serves this file at whatever path was missing,
   so anything relative here resolves against a directory that does not exist */
@font-face{font-family:"Archivo";src:url(/shotty/fonts/archivo.woff2) format("woff2-variations");
  font-weight:400 700;font-display:swap;font-style:normal}
@font-face{font-family:"JetBrains Mono";src:url(/shotty/fonts/jetbrains-mono.woff2) format("woff2-variations");
  font-weight:400 500;font-display:swap;font-style:normal}
:root{--bg:#111110;--text:#ECEAE4;--dim:#9B968A;--line-2:#3A3833;--mark:#E5484D;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center}
::selection{background:rgba(229,72,77,.3);color:#fff}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px;border-radius:2px}
svg{width:36px;height:36px;color:var(--text);opacity:.75;margin-bottom:1.7rem}
h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:700;letter-spacing:-.035em;line-height:1.05;
  max-width:18ch;margin:0 auto;text-wrap:balance}
p{margin-top:1.15rem;color:var(--dim);max-width:44ch;margin-inline:auto}
a{display:inline-flex;align-items:center;min-height:44px;padding:.55rem 1.1rem;margin-top:2.1rem;
  border-radius:7px;background:var(--text);color:var(--bg);text-decoration:none;
  font-family:var(--mono);font-size:.94rem;font-weight:500;transition:background .18s}
a:hover{background:#fff}
</style>
